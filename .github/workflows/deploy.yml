name: Deploy Skymail

on:
  workflow_dispatch:
    inputs:
      zone:
        description: Mail domain on Cloudflare / 已接入 CF 的邮箱域名（example.com）
        required: true
        type: string
      site:
        description: Webmail hostname / 站点域名（默认 mail.<zone>）
        required: false
        type: string
      admin:
        description: Admin email / 管理员邮箱（默认 admin@<zone>）
        required: false
        type: string
      worker:
        description: Worker name / Worker 名
        required: false
        type: string
        default: cloud-mail
      account:
        description: Cloudflare Account ID（Token 能看到多个账号时必填）
        required: false
        type: string
      replace_mx:
        description: Replace existing MX / 覆盖已有 MX
        required: false
        type: boolean
        default: false
      no_r2:
        description: Skip R2 / 不创建 R2
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skymail-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check token secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN."
            echo "Fork this repo, then Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account != '' && inputs.account || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SKYMAIL_ZONE: ${{ inputs.zone }}
          SKYMAIL_SITE: ${{ inputs.site }}
          SKYMAIL_ADMIN: ${{ inputs.admin }}
          SKYMAIL_WORKER: ${{ inputs.worker }}
          SKYMAIL_REPLACE_MX: ${{ inputs.replace_mx }}
          SKYMAIL_NO_R2: ${{ inputs.no_r2 }}
        run: |
          set -euo pipefail
          args=(--cli --ci --zone "$SKYMAIL_ZONE")
          if [ -n "${SKYMAIL_SITE:-}" ]; then args+=(--site "$SKYMAIL_SITE"); fi
          if [ -n "${SKYMAIL_ADMIN:-}" ]; then args+=(--admin "$SKYMAIL_ADMIN"); fi
          if [ -n "${SKYMAIL_WORKER:-}" ]; then args+=(--worker "$SKYMAIL_WORKER"); fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then args+=(--account "$CLOUDFLARE_ACCOUNT_ID"); fi
          if [ "${SKYMAIL_REPLACE_MX:-false}" = "true" ]; then args+=(--replace-mx); fi
          if [ "${SKYMAIL_NO_R2:-false}" = "true" ]; then args+=(--no-r2); fi
          node deploy.mjs "${args[@]}"
